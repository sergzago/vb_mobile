# ================================
# Volleyball Scoreboard - Docker Compose
# ================================
# Сервисы API (server) и фронтенда (frontend). Сервис PocketBase описан
# отдельно — в docker-compose.pb.yml (образ собирается из ./dockerfile.pb).
#
# Файлы «склеиваются» переменной COMPOSE_FILE из .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.pb.yml
# поэтому по умолчанию одной командой поднимается весь стек:
#   docker compose up -d            → pocketbase + server + frontend
#
# Только API и фронтенд, без контейнера PocketBase (внешняя/хостовая БД —
# задайте адрес в .env, см. POCKETBASE_URL ниже):
#   docker compose -f docker-compose.yml up -d
#
# Все настройки — в .env файлах вне контейнеров.
# ================================

services:
  server:
    build:
      # Контекст — корень репозитория: образу нужны js/, credentials.js,
      # pb_schema.json и init-скрипт — всё это запекается (server/Dockerfile).
      context: .
      dockerfile: server/Dockerfile
      # Порт PocketBase подставляется в js/db-config.js на этапе сборки образа,
      # чтобы фоллбэк в браузере (credentials.js → server.url) соответствовал
      # тому, что сервер ожидает в docker-сети и на хосте.
      args:
        POCKETBASE_PORT: ${POCKETBASE_PORT:-8090}
    # Точное имя образа — как у `docker save/load` (см. DOCKER_DEPLOY.md).
    # Без него compose подставит <имя-каталога>-server, не найдёт образ на
    # сервере и попытается собрать его из неполного контекста.
    image: vb_mobile-server:latest
    container_name: volleyball_server
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      # Логи авторизации — named volume (на хосте готовить каталог не нужно).
      # Переменные API приходят из `environment:` ниже; server/.env в контейнер
      # больше не монтируется.
      - server_logs:/usr/src/logs
      # (Опционально) правки без пересборки — раньше это было обязательно:
      # - ./server/.env:/usr/src/app/.env:ro
      # - ./credentials.js:/usr/src/credentials.js:ro
      # - ./js:/usr/src/js:ro
      # - ./pb_schema.json:/usr/src/pb_schema.json:ro
    environment:
      - NODE_ENV=${API_NODE_ENV:-production}
      # Порт ВНУТРИ контейнера фиксирован: маппинг "${API_PORT}:3000",
      # healthcheck и скрипт инициализации проверяют 3000.
      # API_PORT из .env — только хостовой порт.
      - PORT=3000
      - DB_PROVIDER=${DB_PROVIDER:-pocketbase}
      # Режим авторизации: 1 — вход обязателен, 0 — гостевой режим (без токена).
      # Для фронтенда (браузера) значение задаётся в credentials.js (auth.enabled).
      - ENABLE_AUTH=${ENABLE_AUTH:-1}
      # --- Подключение к базе данных (PocketBase) ---
      # По умолчанию БД — ВНУТРИ стека: сервис pocketbase из
      # docker-compose.pb.yml, адрес в docker-сети http://pocketbase:8090.
      # Наружу БД не публикуется (см. docker-compose.pb.yml: только 127.0.0.1).
      # Исключение — внешняя/хостовая БД: задайте адрес в .env и верните
      # extra_hosts (см. ниже):
      #   POCKETBASE_URL=http://host.docker.internal:8090  (PB на этом же хосте)
      #   POCKETBASE_URL=http://192.168.1.10:8090          (PB в локальной сети)
      #   POCKETBASE_URL=https://pb.example.com            (внешний PB)
      - POCKETBASE_URL=${POCKETBASE_URL:-http://pocketbase:8090}
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@volleyball.local}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-changeme_in_production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-true}
    # Порядок запуска: ожидание готовности PocketBase (depends_on) добавляет
    # docker-compose.pb.yml, когда оба compose-файла используются вместе.
    # БД — внутри стека, host.docker.internal не нужен. Для исключения
    # «внешняя БД на хосте» верните:
    #   extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    # Статика (html/css/js) и nginx.conf запечены в образ — на сервере не нужны
    # ни репозиторий, ни bind-mount'ы.
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Порт PocketBase подставляется в отдаваемый браузеру js/db-config.js
      # (фоллбэк подключения; основной путь — прокси /pb/).
      args:
        POCKETBASE_PORT: ${POCKETBASE_PORT:-8090}
    image: vb_mobile-frontend:latest
    container_name: volleyball_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    # (Опционально) правка конфига/статики без пересборки — замените `[]` на:
    #   volumes:
    #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    #     - ./:/usr/share/nginx/html:ro
    volumes: []
    depends_on:
      - server

# Named volumes: данные, живущие вне контейнеров
volumes:
  # Логи API (монтируется в /usr/src/logs)
  server_logs:


<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Администрирование пользователей</title>
    <script>
        // Управление пользователями перенесено в мобильный интерфейс
        // (вкладка "Админ" — доступна администраторам)

            var query = window.location.search || '';
            var sep = query ? '&' : '?';

        })();

    <meta http-equiv="refresh" content="0; url=mobile.html?tab=pageAdmin">
</head>

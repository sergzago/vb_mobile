<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fullscreen Tablo</title>
    <link href="css/css.css" rel="stylesheet">
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="vb-config.js"></script>
    <script src="credentials.js"></script>
    <script src="js/db-config.js"></script>
    <script src="js/db-interface.js"></script>
    <script src="js/common.js"></script>
    <script src="js/scoreboard.js"></script>
    <script>
      /**
       * Режим таймаута на табло.
       * При timeout_active: верхние 2/3 экрана занимают надпись
       * «Таймаут <НАЗВАНИЕ КОМАНДЫ>», а счёт партии уменьшается
       * и размещается в оставшейся трети экрана.
       * Вызывается из js/scoreboard.js при каждом обновлении данных
       * (по той же схеме, что updateScoreboard1Display и др.).
       * @param {object} [data] - данные табло; если не переданы, берётся
       *                           глобальный scoreboard_data
       */
      function updateTabloTimeoutDisplay(data) {
        var $screen = $('.tablo-screen');
        if (!$screen.length) return;
        var d = data
          || (typeof scoreboard_data !== 'undefined' ? scoreboard_data : null)
          || {};
        var active = !!d['timeout_active'];
        if (active) {
          // ctl.js/mobile.js записывают метку вида 'Таймаут <КОМАНДА>'
          var label = String(d['custom_label'] || '').trim();
          if (!label || label.toLowerCase().indexOf('таймаут') !== 0) {
            label = 'Таймаут';
          }
          $('.tablo-timeout-text').text(label);
        }
        $screen.toggleClass('timeout-active', active);
        $('.tablo-timeout').attr('aria-hidden', active ? 'false' : 'true');
      }

      $(document).ready(function(){
        // Переключение темы
        var savedTheme = localStorage.getItem('tablo-theme');
        if (savedTheme === 'dark') {
          $('body').addClass('dark-theme');
        }
        $('#theme-toggle').on('click', function() {
          $('body').toggleClass('dark-theme');
          var isDark = $('body').hasClass('dark-theme');
          localStorage.setItem('tablo-theme', isDark ? 'dark' : 'light');
        });

        // Полноэкранный режим (Fullscreen API)
        function getFullscreenElement() {
          return document.fullscreenElement || document.webkitFullscreenElement
            || document.mozFullScreenElement || document.msFullscreenElement || null;
        }

        // Встроен ли документ в iframe? Сравнение window.self !== window.top
        // безопасно и для cross-origin, и для file:// (исключения не бросает).
        function isEmbedded() {
          try {
            return window.self !== window.top;
          } catch (e) {
            return true; // на всякий случай считаем встроенным
          }
        }

        function updateFullscreenButton() {
          var isFull = !!getFullscreenElement();
          $('#fullscreen-toggle')
            .toggleClass('active', isFull)
            .attr('title', isFull ? 'Выйти из полноэкранного режима' : 'Полноэкранный режим');
        }

        (function initFullscreenToggle() {
          var root = document.documentElement;
          var apiAvailable = !!(root.requestFullscreen || root.webkitRequestFullscreen
            || root.mozRequestFullScreen || root.msRequestFullscreen);

          // В iframe табло не должно уходить в полноэкранный режим само:
          // полноэкранный iframe перекрывает родительский документ (панель
          // мультитабло с кнопкой «Мультитабло» пропадает). Полноэкранный
          // режим на уровне мультитабло переключают его собственные кнопки.
          if (isEmbedded()) {
            $('#fullscreen-toggle').hide();
            return;
          }

          // В iframe без allowfullscreen fullscreenEnabled === false — прячем кнопку
          var allowed = document.fullscreenEnabled;
          if (allowed === undefined) allowed = document.webkitFullscreenEnabled;
          if (allowed === undefined) allowed = document.mozFullScreenEnabled;
          if (!apiAvailable || allowed === false) {
            $('#fullscreen-toggle').hide();
            return;
          }

          $('#fullscreen-toggle').on('click', function() {
            var result;
            if (!getFullscreenElement()) {
              var request = root.requestFullscreen || root.webkitRequestFullscreen
                || root.mozRequestFullScreen || root.msRequestFullscreen;
              if (!request) return;
              result = request.call(root);
            } else {
              var exit = document.exitFullscreen || document.webkitExitFullscreen
                || document.mozCancelFullScreen || document.msExitFullscreen;
              if (!exit) return;
              result = exit.call(document);
            }
            // Отклонённый промис (нет разрешения/встраивание) не должен давать
            // unhandled rejection
            if (result && typeof result.catch === 'function') result.catch(function() {});
          });

          ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
            .forEach(function(eventName) {
              document.addEventListener(eventName, updateFullscreenButton);
            });
          updateFullscreenButton();
        })();

        // Автоподбор размера названий команд: уменьшаем --teams-scale,
        // пока каждое название влезает в свою половину БЕЗ обрезки справа
        // (white-space: nowrap + text-overflow: ellipsis).
        // Сильно длинное название упирается в minScale и режется многоточием.
        // Счёт по сетам (.tablo-general-score) имеет свой font-size и не меняется.
        function fitTeamNames() {
          var container = $('.tablo-teams');
          if (!container.length) return;
          var leftTeam = container.find('.tablo-left-team')[0];
          var rightTeam = container.find('.tablo-right-team')[0];
          if (!leftTeam || !rightTeam) return;
          var el = container[0];
          // Сбрасываем масштаб к базовому
          el.style.setProperty('--teams-scale', '1');
          var scale = 1;
          var minScale = 0.4;
          var step = 0.05;
          // Название обрезано, если scrollWidth больше clientWidth
          // (одна строка, nowrap: всё, что не влезло, уходит за край)
          function isOverflow() {
            return (leftTeam.scrollWidth > leftTeam.clientWidth + 1) ||
                   (rightTeam.scrollWidth > rightTeam.clientWidth + 1);
          }
          var guard = 0;
          while (isOverflow() && scale > minScale && guard < 20) {
            scale = Math.max(minScale, +(scale - step).toFixed(2));
            el.style.setProperty('--teams-scale', String(scale));
            guard++;
          }
        }

        // Инициализация порядка при загрузке/
        setTimeout(function(){
          if(typeof updateTabloSides === 'function'){
            updateTabloSides();
          }
          fitTeamNames();
        }, 500);

        // Пересчёт при смене названий (updateTabloSides в js/scoreboard.js
        // подменяет .html() команд при подписке на данные и смене сторон)
        if (window.MutationObserver) {
          var teamsObserver = new MutationObserver(function() { fitTeamNames(); });
          var teamsEl = document.querySelector('.tablo-teams');
          if (teamsEl) {
            teamsObserver.observe(teamsEl, { childList: true, characterData: true, subtree: true });
          }
        }
        // Пересчёт при повороте/ресайзе экрана
        var fitTimer = null;
        window.addEventListener('resize', function() {
          if (fitTimer) clearTimeout(fitTimer);
          fitTimer = setTimeout(fitTeamNames, 150);
        });
        
        // Функция для обновления отображения истории сетов
        function updateSetHistoryVisibility() {
          const setHistory = $('#set-history-bottom');
          if (setHistory.length > 0) {
            const currentText = setHistory.text().trim();
            // Показываем историю сетов, если есть данные (не пусто и не содержит только пробелы)
            if (currentText && currentText !== '&nbsp;' && currentText !== '' && currentText !== '&') {
              setHistory.show();
            } else {
              setHistory.hide();
            }
          }
        }
        
        // Вызываем функцию при загрузке и при изменении счета
        updateSetHistoryVisibility();
        
        // Наблюдаем за изменениями в истории сетов
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            if (mutation.type === 'childList' || mutation.type === 'characterData') {
              updateSetHistoryVisibility();
            }
          });
        });
        
        // Наблюдаем за элементом set-history-bottom
        const setHistoryElement = document.querySelector('#set-history-bottom');
        if (setHistoryElement) {
          observer.observe(setHistoryElement, {
            childList: true,
            characterData: true,
            subtree: true
          });
        }

        // Начальное состояние блока таймаута (данные придут позже
        // через подписку в js/scoreboard.js)
        updateTabloTimeoutDisplay();
      });
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--body-bg, #ffffff);
        color: var(--top-team-name-text, #000);
        font-family: 'Rubik Mono One', sans-serif;
        overflow: hidden;
        transition: background 0.3s, color 0.3s;
      }

      /* Тёмная тема */
      body.dark-theme {
        background: #000000;
        color: #ff0000;
      }
      body.dark-theme .tablo-general-score {
        color: #cc0000;
      }
      body.dark-theme .set-history {
        background-color: #000;
        color: #ff0000;
      }

      /* Принудительные стили для светлой темы (бело-черная) */
      body:not(.dark-theme) {
        background: #ffffff !important;
        color: #000000 !important;
      }
      body:not(.dark-theme) .tablo-general-score,
      body:not(.dark-theme) .set-history {
        background-color: #ffffff !important;
        color: #000000 !important;
      }

      /* Кнопки переключения темы и полноэкранного режима —
         вертикальная колонка справа вверху (тема сверху, полный экран под ней),
         чтобы длинное название команды их не перекрывало */
      #theme-toggle,
      #fullscreen-toggle {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 9999;
        width: 32px;
        height: 32px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.35);
        color: rgba(0, 0, 0, 0.75);
        border: 1.5px solid rgba(0, 0, 0, 0.35);
        border-radius: 50%;
        font-size: 16px;
        text-align: center;
        padding: 0;
        opacity: 0.55;
        box-shadow: none;
        backdrop-filter: blur(2px);
        transition: opacity 0.3s, transform 0.15s;
      }
      #theme-toggle svg,
      #fullscreen-toggle svg {
        display: block;
        margin: auto;
      }
      #fullscreen-toggle {
        top: 52px; /* под кнопкой темы (10px + 32px + 10px отступ) */
      }
      #theme-toggle:hover,
      #fullscreen-toggle:hover,
      #fullscreen-toggle.active {
        opacity: 1;
        transform: scale(1.06);
        background: rgba(255, 255, 255, 0.6);
      }
      body.dark-theme #theme-toggle,
      body.dark-theme #fullscreen-toggle {
        background: rgba(255, 255, 255, 0.22);
        color: rgba(255, 255, 255, 0.9);
        border: 1.5px solid rgba(255, 255, 255, 0.5);
        box-shadow: none;
      }
      body.dark-theme #theme-toggle:hover,
      body.dark-theme #fullscreen-toggle:hover,
      body.dark-theme #fullscreen-toggle.active {
        background: rgba(255, 255, 255, 0.38);
        opacity: 1;
      }
      .tablo-screen {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: clamp(2px, 1.5vh, 20px) clamp(8px, 3vw, 60px);
        box-sizing: border-box;
        overflow: hidden;
        gap: clamp(2px, 1.5vh, 16px);
      }
      .tablo-teams {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        /* Симметричные отступы: справа — место под вертикальную колонку
           кнопок (тема + полный экран), чтобы длинное название их не
           перекрывало; слева — равный компенсирующий отступ. Без него
           контент строки смещался влево на 24px, и названия команд со
           счётом по сетам расходились по центру с большим счётом
           (и в обычном режиме, и в режиме таймаута). */
        padding-left: 48px;
        padding-right: 48px;
        text-align: center;
        /* Базовый размер строки команд; JS (fitTeamNames) только УМЕНЬШАЕТ
           его через --teams-scale. Счёт по сетам не зависит от масштаба. */
        --teams-base-size: clamp(16px, 4.5vw, 40px);
        --teams-scale: 1;
        font-size: calc(var(--teams-base-size) * var(--teams-scale));
        text-transform: uppercase;
        letter-spacing: clamp(1px, 0.5vw, 4px);
        margin-bottom: 0; /* Убран отступ снизу */
        margin-top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(6px, 2vw, 60px);
        flex-wrap: nowrap;
        min-width: 0;
      }
      .tablo-left-team,
      .tablo-right-team {
        flex: 1 1 0;
        min-width: 0;
        /* Строго одна строка без переносов; сильно длинное название
           обрезается справа с многоточием */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: block;
        line-height: 1.1;
      }
      
      .tablo-general-score {
        font-size: clamp(16px, 4vw, 32px);
        font-weight: bold;
        /* Та же высота строки, что у названий (1.1): при align-items: flex-start
           верх счёта совпадает с верхом названий команд */
        line-height: 1.1;
        color: var(--top-secondary-score-text, #000);
        margin: 0 clamp(6px, 2vw, 30px);
        white-space: nowrap;
        flex: none;
      }
      .tablo-score {
        /* Отступы в em: цифры растянуты через scaleY(2), трансформ не влияет
           на layout — половина прироста высоты (0.5em) визуально уходит
           вверх и вниз от центра, отступы это компенсируют */
        margin-top: 0.65em;
        margin-bottom: 0.6em;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Двоеточие — строгий центр строки: половины счёта занимают равные
           доли ширины, цифры прижаты к центру (к двоеточию) */
        gap: 0;
        width: 100%;
        max-width: 100%;
        font-size: min(30vw, 36vh, 380px);
        line-height: 1;
        white-space: nowrap;
        letter-spacing: -0.05em;
        padding: 0 clamp(4px, 2vw, 30px);
        box-sizing: border-box;
        min-width: 0;
      }
      .tablo-score .home_score,
      .tablo-score .away_score {
        /* Равные половины: разрядность одной стороны не сдвигает центр.
           Порядок визуальный задаёт updateTabloSides через order (1/3);
           выравнивание привязано к нему же, а не к классу.
           order:1 (слева) — растёт влево, order:3 (справа) — вправо */
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
      }
      /* До первой инициализации updateTabloSides (порядок из разметки:
         away слева, home справа) */
      .tablo-score .away_score {
        text-align: right;
        padding-right: 0.06em;
      }
      .tablo-score .home_score {
        text-align: left;
        padding-left: 0.06em;
        padding-right: 0;
      }
      /* После инициализации визуальный порядок задаёт order (1 слева, 3 справа).
         Эти правила идут последними — при равной специфичности побеждают. */
      .tablo-score > [style*="order: 1"],
      .tablo-score > [style*="order:1"] {
        text-align: right;
        padding-right: 0.06em;
        padding-left: 0;
      }
      .tablo-score > [style*="order: 3"],
      .tablo-score > [style*="order:3"] {
        text-align: left;
        padding-left: 0.06em;
        padding-right: 0;
      }

      .set-history {
        display: none;
        background-color: var(--bottom-time-bg, #fff);
        color: var(--bottom-time-text, #000);
        letter-spacing: 1px;
        text-transform: uppercase;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: clamp(12px, 3.5vw, 36px);
        min-height: 20px;
        text-align: center;
        margin-top: 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow-wrap: anywhere;
      }
      .set-history-bottom {
        position: relative;
        width: 100%;
        bottom: auto;
      }
      .tablo-score span {
        display: inline-block;
        transform: scaleY(2);
        transform-origin: center;
      }
      /* Разделитель счёта компактнее цифр, строго по центру */
      .tablo-score .score-separator {
        flex: none;
        font-size: 0.6em;
        transform: scaleY(1.4);
        margin: 0;
      }

      /* Адаптив: узкие экраны (телефоны) */
      @media (max-width: 600px) {
        .tablo-screen {
          justify-content: flex-start;
          padding-top: clamp(2px, 1vh, 10px);
          gap: clamp(2px, 1.5vh, 12px);
        }
        .tablo-teams {
          margin-top: 0;
          /* Названия не сжимаются под давлением счёта */
          flex: none;
        }
        .tablo-score {
          font-size: min(36vw, 30vh);
          /* scaleY(1.6) выносит верх цифр на 0.3em над строкой — компенсируем */
          margin-top: 0.4em;
          margin-bottom: 0.2em;
        }
        .tablo-score span {
          transform: scaleY(1.6);
        }
      }

      /* Адаптив: альбомная ориентация / низкие экраны (телефон повёрнут) */
      @media (max-height: 500px) {
        #theme-toggle,
        #fullscreen-toggle {
          width: 28px;
          height: 28px;
          font-size: 14px;
        }
        #fullscreen-toggle {
          top: 44px; /* 8px + 28px + 8px отступ */
        }
        .tablo-screen {
          justify-content: flex-start;
          gap: 0;
          padding-top: 0;
          padding-bottom: 0;
          padding-left: clamp(4px, 2vw, 20px);
          padding-right: clamp(4px, 2vw, 20px);
        }
        .tablo-teams {
          --teams-base-size: clamp(12px, 3vw, 24px);
          /* Симметричные отступы — строка остаётся отцентрованной */
          padding-left: 40px;
          padding-right: 40px;
        }
        .tablo-general-score {
          font-size: clamp(12px, 3vw, 22px);
        }
        .tablo-score {
          /* Цифры не должны наезжать на названия: scaleY визуально выносит
             верх цифр над строкой на (scaleY-1)/2 от font-size, поэтому
             размер ограничиваем высотой экрана и добавляем верхний отступ */
          font-size: min(28vw, 38vh);
          margin-top: 0.45em;
          margin-bottom: 0;
        }
        .tablo-score span {
          transform: scaleY(1.25);
        }
        .set-history {
          margin-top: 0;
          font-size: clamp(10px, 3vh, 18px);
        }
      }
      /* =====================================================================
         Режим таймаута (timeout_active === true)
         Верхние 2/3 экрана — надпись «Таймаут <НАЗВАНИЕ КОМАНДЫ>»,
         оставшаяся треть — названия команд и уменьшенный счёт партии.
         ===================================================================== */
      .tablo-timeout {
        /* По умолчанию блок не участвует в раскладке */
        display: none;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        text-align: center;
        text-transform: uppercase;
        line-height: 1.05;
        /* Длинная строка переносится, а не обрезается */
        font-size: min(10vw, 16vh, 190px);
        letter-spacing: clamp(1px, 0.4vw, 8px);
        padding: 0 clamp(8px, 3vw, 60px);
      }
      .tablo-timeout-text {
        display: block;
        max-width: 100%;
        overflow-wrap: anywhere;
      }
      /* Обёртка «названия + счёт + история»: в обычном режиме занимает
         всё свободное место (раскладка не меняется), при таймауте —
         оставшуюся треть экрана. gap наследуется от .tablo-screen,
         чтобы отступы между блоками остались прежними и в медиазапросах. */
      .tablo-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        min-height: 0;
        flex: 1 1 auto;
        gap: inherit;
      }

      /* Таймаут включён: надпись — 2/3 высоты, контент — оставшаяся треть */
      .tablo-screen.timeout-active .tablo-timeout {
        display: flex;
        flex: 2 1 0;
        min-height: 0;
      }
      .tablo-screen.timeout-active .tablo-main {
        flex: 1 1 0;
        min-height: 0;
      }
      /* Счёт партии уменьшается и размещается в оставшейся трети.
         Отступы в em остаются пропорциональны размеру цифр, поэтому
         визуальный вылет scaleY(2) по-прежнему компенсируется. */
      .tablo-screen.timeout-active .tablo-score {
        font-size: min(16vw, 9vh, 170px);
        margin-top: 0.55em;
        margin-bottom: 0.5em;
      }
      /* Названия команд и счёт по сетам — компактнее, чтобы поместиться
         в оставшейся трети вместе с историей сетов */
      .tablo-screen.timeout-active .tablo-teams {
        --teams-base-size: clamp(14px, 2.6vw, 28px);
      }
      .tablo-screen.timeout-active .tablo-general-score {
        font-size: clamp(12px, 2.4vw, 24px);
      }
      .tablo-screen.timeout-active .set-history {
        font-size: clamp(10px, 2.4vh, 22px);
        padding: 2px 8px;
        min-height: 0;
        /* Не сжимается под давлением: место под неё освобождает счёт */
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <button id="fullscreen-toggle" title="Полноэкранный режим" aria-label="Полноэкранный режим"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="theme-toggle" title="Переключить тему" aria-label="Переключить тему"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5z"/></svg></button>
    <div class="tablo-screen">
      <!-- Надпись «Таймаут <КОМАНДА>» — занимает верхние 2/3 экрана,
           пока timeout_active === true. Показывает/скрывает updateTabloTimeoutDisplay() -->
      <div class="tablo-timeout" aria-hidden="true">
        <span class="tablo-timeout-text">Таймаут</span>
      </div>
      <!-- Нижняя часть: названия команд, счёт партии и история сетов.
           В обычном режиме — на весь экран, при таймауте — на оставшейся трети -->
      <div class="tablo-main">
        <div class="tablo-teams">
          <span class="tablo-left-team">HOME</span>
          <span class="tablo-general-score">
            <span class="home_sets">0</span>
            <span class="tablo-separator">:</span>
            <span class="away_sets">0</span>
          </span>
          <span class="tablo-right-team">AWAY</span>
        </div>
        <div class="tablo-score">
          <span class="away_score">0</span>
          <span class="tablo-separator score-separator">:</span>
          <span class="home_score">0</span>
        </div>
        <div id="set-history-bottom" class="set-history set-history-bottom">&nbsp;</div>
      </div>
    </div>
  </body>
</html>
